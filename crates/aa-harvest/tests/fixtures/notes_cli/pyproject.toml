[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "notes-cli"
version = "0.1.0"
description = "Hermetic Click fixture shaped like a CLI-Anything harness (agentic-anything tests)"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]
license = "Apache-2.0"

[project.scripts]
notes = "notes_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["notes_cli"]
