syntax = "proto3";

// EngineService: liveness, identity and the kill switch.
package agentic_anything.v1;

import "agentic_anything/v1/common.proto";
import "agentic_anything/v1/record.proto";

service EngineService {
  // Engine identity, listeners, halt state and assurance tier.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (agentic_anything.v1.rpc_policy) = {
      roles: [
        ROLE_AGENT,
        ROLE_OPERATOR
      ]
      allowed_when_halted: true
    };
  }
  // Anyone may pull the brake: cancels in-flight actions, expires pending
  // confirmations, refuses new dispatch. Persisted across restarts.
  rpc Halt(HaltRequest) returns (HaltResponse) {
    option (agentic_anything.v1.rpc_policy) = {
      roles: [
        ROLE_AGENT,
        ROLE_OPERATOR
      ]
      allowed_when_halted: true
      audited: true
    };
  }
  // Only the operator releases, and only for the current halt_epoch.
  rpc Unhalt(UnhaltRequest) returns (UnhaltResponse) {
    option (agentic_anything.v1.rpc_policy) = {
      roles: [ROLE_OPERATOR]
      allowed_when_halted: true
      audited: true
    };
  }
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {
    option (agentic_anything.v1.rpc_policy) = {
      roles: [ROLE_OPERATOR]
      allowed_when_halted: true
      audited: true
    };
  }
}

// Fail-safe zero: ENGINE (the widest scope).
enum HaltScope {
  HALT_SCOPE_ENGINE = 0;
  HALT_SCOPE_TARGET = 1;
  HALT_SCOPE_SESSION = 2;
}

enum HaltSource {
  HALT_SOURCE_UNSPECIFIED = 0;
  HALT_SOURCE_RPC = 1;
  HALT_SOURCE_SENTINEL_FILE = 2; // touch <state>/HALT
  HALT_SOURCE_SIGNAL = 3; // SIGUSR1
  HALT_SOURCE_AUDIT_VERIFY_FAILED = 4; // chain tail failed to verify at boot or runtime
  HALT_SOURCE_PERSISTED = 5; // engine shut down halted
}

message HaltState {
  bool halted = 1;
  uint64 halt_epoch = 2;
  HaltScope scope = 3;
  string scope_subject = 4; // target or session id when scope is narrower
  HaltSource source = 5;
  string reason = 6;
}

message GetStatusRequest {}

message GetStatusResponse {
  string engine_version = 1;
  string protocol_version = 2; // "agentic_anything.v1"
  string workspace_root = 3;
  string agent_listen = 4; // "unix:///.../agent.sock"
  string operator_listen = 5;
  Role caller_role = 6; // as determined by the listener
  HaltState halt = 7;
  AssuranceTier assurance = 8; // computed from proofs
  bool confinement_available = 9; // Seatbelt/Landlock usable on this host
  uint32 target_count = 10;
  uint32 servable_capability_count = 11;
  string audit_head_sha256 = 12;
}

message HaltRequest {
  HaltScope scope = 1;
  string scope_subject = 2;
  string reason = 3;
}

message HaltResponse {
  HaltState halt = 1;
  uint32 cancelled_actions = 2;
}

message UnhaltRequest {
  uint64 halt_epoch = 1; // must equal the current epoch
  string reason = 2;
}

message UnhaltResponse {
  HaltState halt = 1;
}

message ShutdownRequest {
  bool drain = 1;
}

message ShutdownResponse {}
